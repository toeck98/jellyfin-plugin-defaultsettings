name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z. B. 1.3.0.0)'
        required: true
        default: '1.3.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Versionsnummer ermitteln
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Bauen für Version: $VERSION"

      - name: Plugin kompilieren (Release)
        run: |
          dotnet build DefaultSettings.csproj -c Release /p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: ZIP-Paket erstellen
        id: package
        run: |
          mkdir -p artifacts
          cd bin/Release/net10.0/
          zip -j ../../../artifacts/DefaultSettings.zip Jellyfin.Plugin.DefaultSettings.dll
          cd ../../../
          
          # MD5 Prüfsumme berechnen
          CHECKSUM=$(md5sum artifacts/DefaultSettings.zip | cut -d ' ' -f 1)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "MD5 Checksum: $CHECKSUM"

      - name: GitHub Release erstellen & ZIP hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: DefaultSettings v${{ steps.get_version.outputs.VERSION }}
          files: |
            artifacts/DefaultSettings.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Feste manifest.json auf main aktualisieren
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHECKSUM="${{ steps.package.outputs.CHECKSUM }}"
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sicherstellen, dass wir auf dem main-Branch sind
          git fetch origin main
          git checkout main
          git pull origin main --rebase

          # manifest.json mit neuer Version aktualisieren (historische Versionen beibehalten)
          jq --arg v "$VERSION" --arg c "$CHECKSUM" --arg r "$REPO" --arg d "$DATE" '
            .[0].versions = [
              {
                version: $v,
                targetAbi: "12.0.0.0",
                sourceUrl: ("https://github.com/" + $r + "/releases/download/v" + $v + "/DefaultSettings.zip"),
                checksum: $c,
                timestamp: $d,
                changelog: ("Release v" + $v + ": Upgrade für Jellyfin 12.4 (.NET 10), Fehlerbehebung der GUI-Ladefehler und Entkopplung von EF Core")
              }
            ] + (.[0].versions | map(select(.version != $v)))
          ' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json

          git add manifest.json
          git commit -m "chore: update manifest.json to v${VERSION} [skip ci]" || echo "Keine Änderungen zum Committen."
          git push origin main || echo "Push auf main abgeschlossen."
